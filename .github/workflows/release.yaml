name: "📦 Release"
on:
  # Make a release whenever the developer wants.
  workflow_dispatch:
    inputs:
      bump:
        type: string
        description: "major, minor, or patch"
        required: true
        default: "patch"
  # Make a release whenever we're told to by another workflow.
  workflow_call:
    secrets:
      NUGET_USER:
        description: "Username for NuGet"
        required: true
    # Input unifies with the workflow dispatch since it's identical.
    inputs:
      bump:
        type: string
        description: "major, minor, or patch"
        required: true
        default: "patch"
jobs:
  release:
    name: "📦 Release"
    runs-on: ubuntu-latest
    if: github.repository == 'Cubusky/Stats'
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    permissions:
      contents: write
      id-token: write
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}
          lfs: true
          submodules: "recursive"
          fetch-depth: 0 # So we can get all tags.

      - name: 🔎 Read Current Project Version
        id: current-version
        run: |
          echo "tag=$(git tag --sort=v:refname | grep -E '^[^v]' | tail -1)" >> "$GITHUB_OUTPUT"

      - name: 🖨 Print Current Version
        run: |
          echo "Current Version: ${{ steps.current-version.outputs.tag }}"

      - name: 🧮 Compute Next Version
        uses: chickensoft-games/next-godot-csproj-version@v1
        id: next-version
        with:
          project-version: ${{ steps.current-version.outputs.tag }}
          godot-version: 1.0.0
          bump: ${{ inputs.bump }}

      - uses: actions/setup-dotnet@v5
        name: 💽 Setup .NET SDK
        with:
          # Use the .NET SDK from global.json in the root of the repository.
          global-json-file: global.json

      # Write version to file so .NET will build correct version.
      - name: 📝 Write Version to File
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "0.0.0-devbuild"
          replace: ${{ steps.next-version.outputs.version }}
          regex: false
          include: "{**/*.csproj,Directory.Packages.props}"

      - name: 📦 Release Stats.Generators
        uses: ./.github/actions/create_release
        with:
          project: "Cubusky.Stats.Generators"
          version: ${{ steps.next-version.outputs.version }}
          NUGET_USER: ${{ secrets.NUGET_USER }}

      - name: 📦 Release Stats.Core
        uses: ./.github/actions/create_release
        with:
          project: "Cubusky.Stats.Core"
          version: ${{ steps.next-version.outputs.version }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
  
      - name: 📦 Release Stats
        uses: ./.github/actions/create_release
        with:
          project: "Cubusky.Stats"
          version: ${{ steps.next-version.outputs.version }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
