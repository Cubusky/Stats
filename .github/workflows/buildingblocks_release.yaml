name: "📦 BuildingBlocks Release"
on:
  # Make a release whenever the developer wants.
  workflow_dispatch:
    inputs:
      bump:
        type: string
        description: "major, minor, or patch"
        required: true
        default: "patch"
  # Make a release whenever we're told to by another workflow.
  workflow_call:
    secrets:
      NUGET_API_KEY_BUILDINGBLOCKS:
        description: "BuildingBlocks API key for Nuget"
        required: true
      GH_BASIC:
        description: "Personal access token (PAT) for GitHub"
        required: true
    # Input unifies with the workflow dispatch since it's identical.
    inputs:
      bump:
        type: string
        description: "major, minor, or patch"
        required: true
        default: "patch"
jobs:
  release:
    name: "📦 BuildingBlocks Release"
    runs-on: ubuntu-latest
    if: github.repository == 'Cubusky/BuildingBlocks'
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    permissions:
      id-token: write
    steps:
      - name: 🧾 Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_BASIC }}
          lfs: true
          submodules: "recursive"
          fetch-depth: 0 # So we can get all tags.

      - name: 🔎 Read Current Project Version
        id: current-version
        run: |
          echo "tag=$(git tag --sort=v:refname | grep -E '^[^v]' | tail -1)" >> "$GITHUB_OUTPUT"

      - name: 🖨 Print Current Version
        run: |
          echo "Current Version: ${{ steps.current-version.outputs.tag }}"

      - name: 🧮 Compute Next Version
        uses: chickensoft-games/next-godot-csproj-version@v1
        id: next-version
        with:
          project-version: ${{ steps.current-version.outputs.tag }}
          godot-version: 1.0.0
          bump: ${{ inputs.bump }}

      - uses: actions/setup-dotnet@v5
        name: 💽 Setup .NET SDK
        with:
          # Use the .NET SDK from global.json in the root of the repository.
          global-json-file: global.json

      # Write version to file so .NET will build correct version.
      - name: 📝 Write Version to File
        uses: jacobtomlinson/gha-find-replace@v3
        with:
          find: "0.0.0-devbuild"
          replace: ${{ steps.next-version.outputs.version }}
          regex: false
          include: Cubusky.BuildingBlocks/Cubusky.BuildingBlocks.csproj

      - name: 📦 Build
        working-directory: Cubusky.BuildingBlocks
        run: dotnet build -c Release

      - name: 🔎 Get Package Path
        id: package-path
        run: |
          package=$(find ./Cubusky.BuildingBlocks/nupkg -name "*.nupkg")
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "📦 Found package: $package"

      - name: ✨ Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_BASIC }}
        run: |
          version="${{ steps.next-version.outputs.version }}"
          gh release create --title "v$version" --generate-notes "$version" \
            "${{ steps.package-path.outputs.package }}"

      - name: 🔑 Get NuGet Key
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 🛜 Publish to NuGet
        run: |
          dotnet nuget push "${{ steps.package-path.outputs.package }}" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" --skip-duplicate
